name: TravelOps AI - Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ruff
        run: pip install --upgrade ruff

      - name: Run Ruff Lint Checks
        run: ruff check .

      - name: Run Ruff Format Verification
        run: ruff format --check .

  backend-test:
    name: Backend Test Suite (Py3.${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,ml,rag,agents]"

      - name: Execute Full Pytest Suite with Coverage
        run: |
          pytest backend/tests -v --cov=backend/app --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Upload Test Coverage Artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-coverage
          path: coverage.xml
          retention-days: 14

  ai-eval-benchmarks:
    name: AI Quality & Safety Benchmarks (Strict Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System & Project Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,ml,rag,agents]"

      - name: Run Evaluation Benchmarks in Strict Mode
        run: |
          python scripts/run_evaluations.py --strict --output data/evaluation/ci_eval_report.json

      - name: Upload Evaluation Report
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-benchmark-report
          path: data/evaluation/ci_eval_report.json
          retention-days: 14

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Typecheck and Build Frontend Bundle
        working-directory: frontend
        run: npm run build

      - name: Upload Production Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 14

  docker-validation:
    name: Docker Images Build & Compose Syntax Validation
    needs: [lint, backend-test, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/backend.Dockerfile
          push: false
          tags: travelops-backend:latest
          load: true

      - name: Build Frontend Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/frontend.Dockerfile
          push: false
          tags: travelops-frontend:latest
          load: true
