[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "travelops-ai"
version = "0.1.0"
description = "Production-oriented Agentic AI + RAG + GraphRAG + ML Travel Operations Platform"
authors = [{ name = "TravelOps Engineering Team", email = "engineering@travelops.ai" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "aiosqlite>=0.20.0",
    "redis[hiredis]>=5.0.4",
    "qdrant-client>=1.9.1",
    "neo4j>=5.20.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "python-dotenv>=1.0.1",
    "networkx>=3.2.1",
    "nest-asyncio>=1.6.0",
    "joblib>=1.4.2",
    # Machine Learning & Data
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "scikit-learn>=1.5.0",
    # Content Ingestion & RAG
    "pypdf>=4.2.0",
    "beautifulsoup4>=4.12.3",
    # Agentic AI & LangGraph
    "langgraph>=0.0.60",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.7",
    "langchain-anthropic>=0.1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.4.5",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
]
ml = [
    "lightgbm>=4.3.0",
    "xgboost>=2.0.3",
    "shap>=0.45.1",
]
rag = [
    "sentence-transformers>=3.0.0",
]
agents = [
    "langgraph>=0.0.60",
    "langchain-core>=0.2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line too long (handled by formatter)
    "B008", # Do not perform function calls in argument defaults (needed for FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"backend/app/main.py" = ["E402"]


[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --durations=5"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
pythonpath = ["backend", "."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

